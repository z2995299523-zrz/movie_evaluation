name: Validate source
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python deploy/audit_source.py
      - run: python -m pip install -r requirements-web.lock httpx==0.28.1
      - run: python -m pip check
      - run: python deploy/check_release.py web
      - run: bash -n deploy/movie-review-deploy.sh
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python deploy/audit_source.py
      - run: python -m pip install -r requirements.txt
      - run: python deploy/check_release.py desktop
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Browser security regression
        run: node tests/browser_security.mjs
        timeout-minutes: 2
